name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set CARGO_HOME (same drive as project, avoids cross-drive Kotlin error)
        run: |
          New-Item -ItemType Directory -Force -Path "D:\cargo"
          echo "CARGO_HOME=D:\cargo" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Update version from tag
        shell: pwsh
        run: |
          $ver = "$env:GITHUB_REF_NAME" -replace '^v', '' -replace '-.*', ''
          $c = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $c.version = $ver
          $c | ConvertTo-Json -Depth 32 | Set-Content src-tauri\tauri.conf.json
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = $ver
          $p | ConvertTo-Json -Depth 32 | Set-Content package.json
          (Get-Content src-tauri\Cargo.toml) -replace '^version = ".*"', "version = `"$ver`"" | Set-Content src-tauri\Cargo.toml

      - name: Install dependencies
        run: npm ci

      - name: Restore keystore from secret
        shell: pwsh
        run: |
          if ($env:KEYSTORE_B64) {
            $bytes = [Convert]::FromBase64String($env:KEYSTORE_B64)
            [IO.File]::WriteAllBytes("src-tauri\keystore.jks", $bytes)
            echo "Keystore restored from secret"
          } else {
            echo "WARN: ANDROID_KEYSTORE_BASE64 secret not set, keystore will be generated"
          }
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build (exe + APK)
        run: .\build.bat
        env:
          RUSTC_WRAPPER: sccache

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/Notes-Windows-x64.exe
            release/Notes-Android-arm64-v8a.apk

  build-linux:
    # 串行在 Windows job 之后：两个 job 都往同一个 Release 上传产物，
    # 并发跑会互相抢 Release（可能让 exe / APK 上传失败）。
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Update version from tag
        run: |
          ver="$GITHUB_REF_NAME"
          ver="${ver#v}"
          ver="${ver%%-*}"
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = ver;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = ver;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            const toml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            fs.writeFileSync("src-tauri/Cargo.toml", toml.replace(/^version = ".*"/m, `version = "${ver}"`));
          ' "$ver"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux binary
        run: ./build.sh
        env:
          RUSTC_WRAPPER: sccache

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/Notes-Linux-x86_64
